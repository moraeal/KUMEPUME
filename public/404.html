    <meta name="robots" content="noindex" />
    <title>KUMEPUME 페이지로 이동 중입니다</title>
    <script>
      (function () {
        var projectRoot = window.location.pathname.indexOf("/KUMEPUME/") === 0 ? "/KUMEPUME/" : "/";
        var target = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(projectRoot + "?kumepume-spa=" + encodeURIComponent(target));
      })();
    </script>
  </head>
