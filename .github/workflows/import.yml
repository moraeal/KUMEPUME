name: Import KUMEPUME site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Fetch KUMEPUME source
        run: git clone --depth 1 --branch kumepume-site https://github.com/moraeal/Seed.git /tmp/kumepume-source

      - name: Replace destination content
        run: |
          rm -rf /tmp/kumepume-source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/kumepume-source/. .
          rm -f .github/workflows/preview-build.yml
          rm -f .github/workflows/repository-drive-backup.yml
          rm -f .github/workflows/supabase-drive-backup.yml

      - name: Commit imported site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import KUMEPUME website"
          git push origin HEAD:main
